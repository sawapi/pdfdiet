name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # smallpeg is developed alongside as a sibling path dependency; check
      # both out side by side so `path = "../smallpeg"` resolves.
      - uses: actions/checkout@v4
        with:
          path: pdfdiet
      - uses: actions/checkout@v4
        with:
          repository: sawapi/smallpeg
          path: smallpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pdfdiet
      - name: Format
        working-directory: pdfdiet
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: pdfdiet
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Clippy (wasm bindings)
        working-directory: pdfdiet
        run: cargo clippy --release -p pdfdiet-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        working-directory: pdfdiet
        run: cargo test --release
      - name: Library without the CLI
        working-directory: pdfdiet
        run: cargo check --no-default-features
      - name: Docs
        working-directory: pdfdiet
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Package check (against the published smallpeg)
        working-directory: pdfdiet
        run: cargo publish --dry-run --allow-dirty

  npm:
    # The WebAssembly build and the npm package made from it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pdfdiet
      - uses: actions/checkout@v4
        with:
          repository: sawapi/smallpeg
          path: smallpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pdfdiet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-bindgen CLI (the version in Cargo.lock)
        working-directory: pdfdiet
        run: |
          v=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$v" --locked
      - name: Install Binaryen (wasm-opt)
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_116/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: pdfdiet
        run: ./build-npm.sh
      - name: Test
        working-directory: pdfdiet
        run: node npm/test.mjs
      - name: Pack
        working-directory: pdfdiet/npm
        run: npm pack --dry-run

  msrv:
    # rust-version in Cargo.toml is a promise; this keeps it honest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pdfdiet
      - uses: actions/checkout@v4
        with:
          repository: sawapi/smallpeg
          path: smallpeg
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pdfdiet
      - name: Build at the declared MSRV
        working-directory: pdfdiet
        run: cargo build --release
