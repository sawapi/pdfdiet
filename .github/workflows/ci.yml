name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # smallpeg is developed alongside as a sibling path dependency; check
      # both out side by side so `path = "../smallpeg"` resolves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pdfdiet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sawapi/smallpeg
          path: smallpeg
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: pdfdiet
      - name: Format
        working-directory: pdfdiet
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: pdfdiet
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Clippy (wasm bindings)
        working-directory: pdfdiet
        run: cargo clippy --release -p pdfdiet-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        working-directory: pdfdiet
        run: cargo test --release
      - name: Library without the CLI
        working-directory: pdfdiet
        run: cargo check --no-default-features
      - name: Docs
        working-directory: pdfdiet
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Package check (against the published smallpeg)
        working-directory: pdfdiet
        run: cargo publish --dry-run --allow-dirty

  npm:
    # The WebAssembly build and the npm package made from it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pdfdiet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sawapi/smallpeg
          path: smallpeg
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: pdfdiet
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install wasm-bindgen CLI (the version in Cargo.lock)
        working-directory: pdfdiet
        run: |
          v=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$v" --locked
      - name: Install Binaryen (wasm-opt)
        run: |
          # Verified against the digest recorded here before anything runs.
          curl -sSfLo "$RUNNER_TEMP/binaryen.tgz" https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz
          echo "c55b74f3109cdae97490faf089b0286d3bba926bb6ea5ed00c8c784fc53718fd  $RUNNER_TEMP/binaryen.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binaryen.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_116/bin" >> "$GITHUB_PATH"
      - name: Install TypeScript
        working-directory: pdfdiet/npm
        run: npm ci
      - name: Build
        working-directory: pdfdiet
        run: ./build-npm.sh
      - name: Test (smoke test and type test)
        working-directory: pdfdiet/npm
        run: npm test
      - name: Pack
        working-directory: pdfdiet/npm
        run: npm pack --dry-run

  msrv:
    # rust-version in Cargo.toml is a promise; this keeps it honest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pdfdiet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sawapi/smallpeg
          path: smallpeg
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: pdfdiet
      - name: Build at the declared MSRV
        working-directory: pdfdiet
        run: cargo build --release
