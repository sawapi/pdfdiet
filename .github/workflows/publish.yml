name: Publish

# Publishes the crate to crates.io and/or the npm package, from the commit
# the workflow runs on. Both registries use trusted publishing (OIDC): each
# lists this workflow as a trusted publisher, so no registry token is stored.
#
# The check job tests everything, packs the npm tarball, smoke-tests it and
# records its sha512. Only the publish jobs can request an OIDC token, and
# the npm job stages exactly the tarball the check job hashed; a maintainer
# then approves the staged version on npmjs.com. With "Dry run" on (the
# default), everything runs except the uploads.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (no actual publish)"
        type: boolean
        default: true
      crate:
        description: "Publish the crate to crates.io"
        type: boolean
        default: false
      npm:
        description: "Publish the npm package"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      # smallpeg is developed alongside as a sibling path dependency; check
      # both out side by side so `path = "../smallpeg"` resolves. The
      # published crate depends on the crates.io release instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pdfdiet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sawapi/smallpeg
          path: smallpeg
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Versions agree
        id: version
        working-directory: pdfdiet
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          bindings=$(grep -m1 '^version = ' wasm/Cargo.toml | cut -d'"' -f2)
          pkg=$(node -p "require('./npm/package.json').version")
          echo "crate $crate, bindings $bindings, npm $pkg"
          if [ "$crate" != "$bindings" ] || [ "$crate" != "$pkg" ]; then
            echo "versions differ" >&2
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

      - name: Test the crate
        working-directory: pdfdiet
        run: cargo test --release

      - name: Check the crate package
        working-directory: pdfdiet
        run: |
          cargo package --list
          cargo publish --dry-run

      - name: Install wasm-bindgen CLI (the version in Cargo.lock)
        working-directory: pdfdiet
        run: |
          v=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$v" --locked

      - name: Install Binaryen (wasm-opt)
        run: |
          # Verified against the digest recorded here before anything runs.
          curl -sSfLo "$RUNNER_TEMP/binaryen.tgz" https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz
          echo "c55b74f3109cdae97490faf089b0286d3bba926bb6ea5ed00c8c784fc53718fd  $RUNNER_TEMP/binaryen.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binaryen.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_116/bin" >> "$GITHUB_PATH"

      - name: Build and test the npm package
        working-directory: pdfdiet
        run: |
          npm ci --prefix npm
          ./build-npm.sh
          npm test --prefix npm

      # The log lists the files and the sha512 integrity (the value
      # `npm view @sawapi/pdfdiet@<version> dist.integrity` reports once
      # published).
      - name: Pack
        id: pack
        working-directory: pdfdiet/npm
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          tarball=$(ls "$RUNNER_TEMP"/pack/sawapi-pdfdiet-*.tgz)
          tar -tzf "$tarball" | sort
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          echo "$(basename "$tarball") $integrity"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      # Upload before the smoke test, so nothing it installs can alter what
      # gets published.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Smoke-test the tarball
        run: |
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/pack/sawapi-pdfdiet-*.tgz
          node -e 'const p = require("@sawapi/pdfdiet"); let ok = false; try { p.compress(new Uint8Array([1, 2, 3])); } catch (e) { ok = e instanceof p.PdfdietError && e.reason === "invalid-pdf"; } if (!ok) process.exit(1); console.log("require ok")'
          node --input-type=module -e 'import { inspect, PdfdietError } from "@sawapi/pdfdiet"; let ok = false; try { inspect(new Uint8Array([1, 2, 3])); } catch (e) { ok = e instanceof PdfdietError && e.reason === "invalid-pdf"; } if (!ok) process.exit(1); console.log("import ok")'
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { createRequire } from "node:module"; import { init, inspect, PdfdietError } from "@sawapi/pdfdiet/web"; const wasm = readFileSync(createRequire(import.meta.url).resolve("@sawapi/pdfdiet/package.json").replace(/package\.json$/, "web/pdfdiet_wasm_bg.wasm")); await init(wasm); let ok = false; try { inspect(new Uint8Array([1, 2, 3])); } catch (e) { ok = e instanceof PdfdietError && e.reason === "invalid-pdf"; } if (!ok) process.exit(1); console.log("web ok")'
          npx --no-install pdfdiet 2>&1 | grep -q "usage" && echo "cli ok"

  publish-crate:
    needs: check
    if: ${{ inputs.crate }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pdfdiet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sawapi/smallpeg
          path: smallpeg
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      # Trusted publishing: exchanges this job's OIDC token for a
      # short-lived crates.io token, revoked when the job ends.
      - name: Authenticate with crates.io
        if: ${{ !inputs.dry-run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pdfdiet ${{ needs.check.outputs.version }}
        if: ${{ !inputs.dry-run }}
        working-directory: pdfdiet
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

      - name: Dry run
        if: ${{ inputs.dry-run }}
        working-directory: pdfdiet
        run: cargo publish --dry-run

  publish-npm:
    needs: check
    if: ${{ inputs.npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack

      # Publish only the tarball the check job hashed right after packing.
      - name: Find and verify the tarball
        env:
          EXPECTED: ${{ needs.check.outputs.integrity }}
        run: |
          tarball=$(ls "$RUNNER_TEMP"/pack/sawapi-pdfdiet-*.tgz)
          actual="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          echo "$(basename "$tarball") $actual"
          if [ -z "$EXPECTED" ] || [ "$actual" != "$EXPECTED" ]; then
            echo "integrity does not match the check job's: expected '$EXPECTED'" >&2
            exit 1
          fi
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      # `npm stage` needs npm 11.15 or later.
      - name: Check npm
        run: |
          v=$(npm --version)
          echo "npm $v"
          if [ "$(printf '%s\n' 11.15.0 "$v" | sort -V | head -1)" != 11.15.0 ]; then
            echo "npm $v cannot stage; 11.15.0 or later is required" >&2
            exit 1
          fi

      # Trusted publishing: npm authenticates with this job's OIDC token and
      # attaches provenance on its own. The version waits for approval.
      - name: Stage pdfdiet ${{ needs.check.outputs.version }}
        if: ${{ !inputs.dry-run }}
        run: npm stage publish "$TARBALL" --access public
